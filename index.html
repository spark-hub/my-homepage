<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark — 系统测试工程师</title>
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #08080f;
            --surface: rgba(20, 20, 35, 0.7);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text-primary: #e8e6f0;
            --text-secondary: #a8a5b8;
            --text-muted: #6b6880;
            --accent-glow: #a78bfa;
            --accent-glow-2: #f472b6;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow-md: 0 4px 32px rgba(0,0,0,0.4);
            --shadow-lg: 0 12px 56px rgba(0,0,0,0.5);
            --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Georgia', 'Times New Roman', 'Songti SC', 'SimSun', serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-serif);
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ===== Animated Gradient Background ===== */
        .bg-animated {
            position: fixed;
            inset: -50%;
            z-index: 0;
            background:
                radial-gradient(ellipse 40% 40% at 20% 30%, rgba(167,139,250,0.12), transparent),
                radial-gradient(ellipse 35% 35% at 70% 60%, rgba(244,114,182,0.10), transparent),
                radial-gradient(ellipse 30% 30% at 50% 80%, rgba(167,139,250,0.08), transparent),
                radial-gradient(ellipse 25% 25% at 80% 20%, rgba(99,102,241,0.10), transparent);
            animation: bg-drift 20s ease-in-out infinite;
        }

        @keyframes bg-drift {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            25% {
                transform: translate(2%, -1%) rotate(1deg) scale(1.05);
            }
            50% {
                transform: translate(-1%, 2%) rotate(-0.5deg) scale(1.08);
            }
            75% {
                transform: translate(-2%, -1%) rotate(0.5deg) scale(1.03);
            }
            100% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
        }

        /* ===== Floating particles (CSS-only) ===== */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(167,139,250,0.15);
            animation: float-up linear infinite;
        }

        .particle:nth-child(1)  { width: 4px;  height: 4px;  left: 10%; animation-duration: 14s; animation-delay: 0s; }
        .particle:nth-child(2)  { width: 6px;  height: 6px;  left: 25%; animation-duration: 18s; animation-delay: 2s; }
        .particle:nth-child(3)  { width: 3px;  height: 3px;  left: 40%; animation-duration: 12s; animation-delay: 4s; }
        .particle:nth-child(4)  { width: 5px;  height: 5px;  left: 55%; animation-duration: 16s; animation-delay: 1s; }
        .particle:nth-child(5)  { width: 3px;  height: 3px;  left: 70%; animation-duration: 20s; animation-delay: 3s; }
        .particle:nth-child(6)  { width: 4px;  height: 4px;  left: 85%; animation-duration: 15s; animation-delay: 5s; }
        .particle:nth-child(7)  { width: 5px;  height: 5px;  left: 15%; animation-duration: 22s; animation-delay: 6s; }
        .particle:nth-child(8)  { width: 3px;  height: 3px;  left: 50%; animation-duration: 13s; animation-delay: 7s; }
        .particle:nth-child(9)  { width: 4px;  height: 4px;  left: 65%; animation-duration: 19s; animation-delay: 8s; }
        .particle:nth-child(10) { width: 6px;  height: 6px;  left: 35%; animation-duration: 17s; animation-delay: 9s; }

        @keyframes float-up {
            0% {
                bottom: -10%;
                opacity: 0;
                transform: translateX(0) scale(0);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                bottom: 110%;
                opacity: 0;
                transform: translateX(40px) scale(1.5);
            }
        }

        /* ===== Card Container ===== */
        .card {
            position: relative;
            z-index: 1;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 640px;
            width: 100%;
            padding: 3rem 3rem 2.5rem;
            transition: box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
            border-color: rgba(167,139,250,0.2);
        }

        /* ===== Avatar ===== */
        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a78bfa, #c084fc, #f472b6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 1.5rem;
            user-select: none;
            box-shadow: 0 4px 20px rgba(167,139,250,0.3);
        }

        /* ===== Typography ===== */
        .name {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .title {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--accent-glow);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 1.75rem;
        }

        .tagline {
            font-size: 1.15rem;
            font-weight: 400;
            font-style: italic;
            color: var(--text-primary);
            margin-bottom: 1rem;
            padding-left: 1.25rem;
            border-left: 2px solid var(--accent-glow);
            line-height: 1.7;
        }

        .description {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.9;
            margin-bottom: 2rem;
        }

        /* ===== Divider ===== */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            margin: 1.5rem 0 2rem;
        }

        /* ===== Social Links ===== */
        .social-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 1rem;
        }

        .social-links {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.1rem;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 400;
            transition: all 0.25s ease;
            background: rgba(255,255,255,0.03);
        }

        .social-link:hover {
            color: var(--accent-glow);
            border-color: rgba(167,139,250,0.4);
            background: rgba(167,139,250,0.08);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(167,139,250,0.12);
        }

        .social-link .icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* ===== Footer ===== */
        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* ===== Responsive ===== */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            .card {
                padding: 2rem 1.5rem 1.75rem;
                border-radius: var(--radius-sm);
            }

            .name {
                font-size: 1.7rem;
            }

            .avatar {
                width: 56px;
                height: 56px;
                font-size: 1.5rem;
            }

            .social-links {
                gap: 0.5rem;
            }

            .social-link {
                padding: 0.5rem 0.85rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background gradient -->
    <div class="bg-animated" aria-hidden="true"></div>

    <!-- Floating particles -->
    <div class="particles" aria-hidden="true">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <main class="card">
        <!-- Avatar -->
        <div class="avatar" aria-hidden="true">S</div>

        <!-- Name & Title -->
        <h1 class="name">Spark</h1>
        <p class="title">系统测试工程师</p>

        <!-- Tagline -->
        <p class="tagline">
            我相信高质量的软件源于对每一个细节的执着。
        </p>

        <!-- Description -->
        <p class="description">
            你好，我是 Spark，一名专注于系统测试的工程师。我热爱在复杂的系统中寻找隐藏的缺陷，
            用严谨的测试用例守护每一行代码的质量。无论是自动化测试框架的搭建，还是性能瓶颈的
            定位分析，我都乐在其中。对我而言，测试不仅仅是发现 Bug——更是对产品负责、
            对用户负责的承诺。
        </p>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Social Links -->
        <p class="social-label">找到我</p>
        <div class="social-links">
            <!-- GitHub -->
            <a href="#" class="social-link" aria-label="GitHub">
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">

                </svg>
                GitHub
            </a>

            <!-- X / Twitter -->
            <a href="#" class="social-link" aria-label="X (Twitter)">
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
                X
            </a>

            <!-- Email -->
            <a href="mailto:#" class="social-link" aria-label="Email">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
                Email
            </a>

            <!-- LinkedIn -->
            <a href="#" class="social-link" aria-label="LinkedIn">
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
                LinkedIn
            </a>
        </div>

        <!-- Footer -->
        <p class="footer">&copy; 2026 Spark &mdash; Built with care.</p>
    </main>
</body>
</html>
